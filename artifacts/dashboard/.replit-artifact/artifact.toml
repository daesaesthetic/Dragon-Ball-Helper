kind = "web"
previewPath = "/"
title = "Bot Dashboard"
description = "A web dashboard for managing the Discord moderation bot. Shows live moderation logs, per-guild automod configuration, infraction history, and bot status. Used by server administrators to monitor and configure the bot without leaving the browser."
version = "1.0.0"
id = "artifacts/dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23183

[services.development]
run = "pnpm --filter @workspace/dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23183"
BASE_PATH = "/"
